services:
  agent:
    image: ${DIND_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped
    env_file:
    - .env
    environment:
      AGENT_UID: '${AGENT_UID:?Ustaw AGENT_UID na wynik id -u}'
      AGENT_GID: '${AGENT_GID:?Ustaw AGENT_GID na wynik id -g}'
    ports:
    - 0.0.0.0:${SSH_PORT}:22
    - 0.0.0.0:${SERVICE_PORT}:7777
    - 127.0.0.1:${DIND_SERVICE_PORT}:7778
    volumes:
    - ${SSH_AUTHORIZED_KEYS}:/home/agent/.ssh/authorized_keys:ro
    - /var/lib/ssh-host-keys
    - ./setup.sh:/usr/local/bin/setup.sh:ro
    - /workspaces
    init: true
    entrypoint:
    - /bin/bash
    - -c
    - |
      set -eu
      case "$$AGENT_UID:$$AGENT_GID" in
        *[!0-9:]*|:*|*:|0:*|*:0) echo 'AGENT_UID i AGENT_GID muszą być niezerowymi liczbami' >&2; exit 1 ;;
      esac
      old_uid="$$(id -u agent)"
      old_gid="$$(id -g agent)"
      if [ "$$old_gid" != "$$AGENT_GID" ]; then /usr/sbin/groupmod -g "$$AGENT_GID" agent; fi
      if [ "$$old_uid" != "$$AGENT_UID" ]; then /usr/sbin/usermod -u "$$AGENT_UID" agent; fi
      # Nie zmieniaj montowanego pliku authorized_keys ani innych właścicieli.
      for dir in /home/agent /workspaces; do
        find "$$dir" -xdev -path /home/agent/.ssh/authorized_keys -prune -o -uid "$$old_uid" -exec chown -h "$$AGENT_UID" {} +
        find "$$dir" -xdev -path /home/agent/.ssh/authorized_keys -prune -o -gid "$$old_gid" -exec chgrp -h "$$AGENT_GID" {} +
      done
      /usr/local/bin/setup.sh >&2 </dev/null &
      exec /usr/local/sbin/docker-entrypoint
    secrets:
    - GH_TOKEN
    - GHCR_TOKEN
  dind:
    image: docker:29-dind
    privileged: true
    restart: unless-stopped
    network_mode: service:agent
    depends_on:
      agent:
        condition: service_started
        restart: true
    environment:
      DOCKER_TLS_CERTDIR: ''
    command:
    - dockerd
    - --host=tcp://127.0.0.1:2375
    tmpfs:
    - /var/lib/docker
    healthcheck:
      test:
      - CMD
      - docker
      - -H
      - tcp://127.0.0.1:2375
      - info
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    
secrets:
  GH_TOKEN:
    file: ${SECRETS_DIR:-${HOME}/.secrets}/GH_TOKEN
  GHCR_TOKEN:
    file: ${SECRETS_DIR:-${HOME}/.secrets}/GHCR_TOKEN

